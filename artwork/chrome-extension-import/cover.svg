<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Chrome 擴充套件匯入教學</title>
  <desc id="desc">深藍色教學首圖：解壓縮、開啟開發人員模式、載入未封裝項目。</desc>
  <rect width="1200" height="630" fill="#00102e"/>
  <rect x="72" y="64" width="52" height="6" rx="3" fill="#d65050"/>
  <text x="72" y="112" font-family="PingFang TC, sans-serif" font-size="23" font-weight="600" fill="#b8c8e3">CHROME 操作教學</text>
  <text x="72" y="235" font-family="PingFang TC, sans-serif" font-size="64" font-weight="600" fill="#ffffff">Chrome 擴充套件</text>
  <text x="72" y="320" font-family="PingFang TC, sans-serif" font-size="64" font-weight="600" fill="#ffffff">手動匯入教學</text>
  <text x="74" y="378" font-family="PingFang TC, sans-serif" font-size="26" fill="#b8c8e3">從 ZIP 檔案到載入完成，一步步設定</text>
  <rect x="72" y="432" width="302" height="70" rx="12" fill="#142642"/>
  <text x="96" y="478" font-family="PingFang TC, sans-serif" font-size="24" font-weight="600" fill="#ffffff">01　解壓縮 ZIP 檔案</text>
  <rect x="390" y="432" width="344" height="70" rx="12" fill="#142642"/>
  <text x="414" y="478" font-family="PingFang TC, sans-serif" font-size="24" font-weight="600" fill="#ffffff">02　開啟開發人員模式</text>
  <rect x="750" y="432" width="378" height="70" rx="12" fill="#d65050"/>
  <text x="774" y="478" font-family="PingFang TC, sans-serif" font-size="24" font-weight="600" fill="#ffffff">03　載入未封裝項目</text>
  <text x="72" y="571" font-family="PingFang TC, sans-serif" font-size="21" fill="#b8c8e3">Windows・macOS・Linux 電腦版</text>
  <text x="1128" y="571" font-family="PingFang TC, sans-serif" font-size="23" font-weight="600" fill="#ffffff" text-anchor="end">Max 行銷誌</text>
</svg>
