<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>對象分頁 · NetSuite 教學圖稿</title><link rel="stylesheet" href="../../docs/assets/css/posts/netsuite.css?v=20261015-4"><link rel="stylesheet" href="artwork.css?v=20261015-5"></head><body class="artwork-solo"><section id="audience-settings" class="artboard" aria-label="對象分頁"><div class="ns-builder" role="group" aria-label="更多選項與對象分頁的介面示意">
    <div class="ns-builder__titlebar"><strong>報表產生器</strong><span>介面示意</span></div>
    <div class="ns-builder__toolbar"><span>編輯版面配置</span><span>編輯資料欄</span><span>篩選條件</span><span>排序</span><strong>更多選項</strong></div>
    <div class="ns-builder__body">
      <div class="ns-builder__fields"><div><span class="ns-field-label">名稱</span><span class="ns-field-value">示範自訂報表</span></div><div><span class="ns-field-label">擁有者</span><span class="ns-field-value">報表擁有者</span></div></div>
      <div class="ns-builder__tabs"><span class="is-current">對象</span><span>存取</span><span>稽核軌跡</span></div>
      <p class="ns-builder__hint">選取分享對象，讓對方能在「所有已儲存報表」找到這張表。</p>
      <div class="ns-grid ns-grid--three ns-builder__selections">
        <div><p class="ns-field-label">內部角色</p><ul class="ns-selection-list"><li class="is-selected">目標角色 A</li><li class="is-selected">目標角色 B</li></ul></div>
        <div><p class="ns-field-label">部門</p><ul class="ns-selection-list"><li class="ns-selection-list__empty">不限定部門</li><li>指定部門（選用）</li></ul></div>
        <div><p class="ns-field-label">員工</p><ul class="ns-selection-list"><li class="ns-selection-list__empty">依需要指定員工</li></ul></div>
      </div>
      <p class="ns-builder__footnote">不需要每個欄位都填。需要以團隊維護名單時，也可選擇群組。</p>
    </div>
    <div class="ns-builder__footer"><span>預覽</span><strong>儲存</strong><span>另存新檔</span></div>
  </div></section></body></html>
